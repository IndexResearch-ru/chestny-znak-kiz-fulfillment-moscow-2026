t-family="Arial" font-size="16" fill="#26485f">Транспортная агрегация</text><text x="1016" y="229" font-family="Arial" font-size="22" fill="#0e3455">5 + RFL</text><text x="40" y="312" font-family="Arial" font-size="17" fill="#627888">Сценарии пересекаются. RFL — крупный 3PL с особым договорным условием; числа не являются баллами.</text></svg>
